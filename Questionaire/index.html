<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Profile Questionnaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span class="title">Dating Profile Questionnaire — Portfolio Project#3</span>
            <a href="../index.html" class="close-btn" title="Back to Start">×</a>
        </div>

        <div class="window-content">
            <p class="intro">
                Basic profile information.  
            </p>

            <form id="datingForm">
                <div class="form-group">
                    <label for="displayName">1. Display Name</label>
                    <input type="text" id="displayName" name="displayName" required>
                </div>

                <!-- 2. Age -->
                <div class="form-group">
                    <label for="age">2. Age</label>
                    <input type="number" id="age" name="age" placeholder="e.g. 25" required>
                </div>

                <div class="form-group">
                    <label>3. Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Non-binary"> Non-binary</label>
                        <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>4. Looking for</label>
                    <div class="radio-group">
                        <label><input type="radio" name="lookingFor" value="Men" required> Men</label>
                        <label><input type="radio" name="lookingFor" value="Women"> Women</label>
                        <label><input type="radio" name="lookingFor" value="Everyone"> Everyone</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="height">5. Height (cm)</label>
                    <input type="number" id="height" name="height" required>
                </div>

                <div class="form-group">
                    <label for="city">6. City / Location</label>
                    <input type="text" id="city" name="city" required>
                </div>

                <div class="form-group">
                    <label for="education">7. Education Level</label>
                    <select id="education" name="education" required>
                        <option value="">Select...</option>
                        <option value="High School">High School</option>
                        <option value="Bachelor">Bachelor’s Degree</option>
                        <option value="Master">Master’s Degree</option>
                        <option value="PhD">PhD / Doctorate</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>8. Interests</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="interests" value="Music"> Music</label>
                        <label><input type="checkbox" name="interests" value="Movies"> Movies / Series</label>
                        <label><input type="checkbox" name="interests" value="Sports"> Sports</label>
                        <label><input type="checkbox" name="interests" value="Travel"> Travel</label>
                        <label><input type="checkbox" name="interests" value="Reading"> Reading</label>
                        <label><input type="checkbox" name="interests" value="Cooking"> Cooking</label>
                        <label><input type="checkbox" name="interests" value="Gaming"> Gaming</label>
                        <label><input type="checkbox" name="interests" value="Art"> Art / Design</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="about">9. About Me (short bio)</label>
                    <textarea id="about" name="about" rows="3" placeholder="a short introduction..."></textarea>
                </div>

                <div class="button-row">
                    <button type="submit" class="xp-button primary">Submit Profile</button>
                    <button type="button" id="downloadBtn" class="xp-button">Download Dataset (CSV)</button>
                    <button type="button" id="clearBtn" class="xp-button">Clear Form</button>
                </div>
            </form>

            <!-- Result area -->
            <div id="result" class="result hidden">
                <h3>Profile Submitted</h3>
                <p id="reportText"></p>
                <p class="saved-note">✓ Data saved locally. You can download the full dataset.</p>
            </div>
        </div>

        <footer>
            <p>Developed by Aryal Pramod [2573412], Khatiwada Rabin [2573400] and Mandal Rajnish [2670971]</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
