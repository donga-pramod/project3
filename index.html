<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Project#3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Recycle Bin Easter Egg -->
    <div id="recycle-hotspot" title="Recycle Bin"></div>
    <!-- Main Navigation Window -->
    <div class="window">
      <div class="title-bar">
        <span class="title">Portfolio Project#3</span>
      </div>
      <div class="window-content">
        <p class="instruction">Select a tool to continue:</p>

        <div class="button-container">
          <a
            href="Questionaire/index.html"
            class="xp-button"
            onclick="openApp('questionnaire')"
          >
            Online Questionnaire
          </a>

          <a
            href="Observation-tool/index.html"
            class="xp-button"
            onclick="openApp('observation')"
          >
            Observation Tool
          </a>
        </div>
      </div>

      <footer>
        <p>
          Developed by Aryal Pramod [2573412], Khatiwada Rabin [2573400] and
          Mandal Rajnish [2573408]
        </p>
      </footer>
    </div>

    <!-- Windows XP Taskbar -->
    <div id="taskbar">
      <div class="start-button" id="startButton">
        <div class="start-logo"></div>
        <span>Start</span>
      </div>

      <div class="taskbar-apps" id="taskbarApps">
        <!-- Open app buttons will appear here -->
      </div>

      <div class="system-tray">
        <div id="xp-clock">12:00 AM</div>
      </div>
    </div>

    <script>
      function openApp(appName) {
        let openApps = JSON.parse(localStorage.getItem("openApps") || "[]");
        if (!openApps.includes(appName)) {
          openApps.push(appName);
          localStorage.setItem("openApps", JSON.stringify(openApps));
        }
      }

      function closeApp(appName) {
        let openApps = JSON.parse(localStorage.getItem("openApps") || "[]");
        openApps = openApps.filter((app) => app !== appName);
        localStorage.setItem("openApps", JSON.stringify(openApps));
        renderTaskbar();
      }

      function renderTaskbar() {
        const container = document.getElementById("taskbarApps");
        const openApps = JSON.parse(localStorage.getItem("openApps") || "[]");
        container.innerHTML = "";

        openApps.forEach((app) => {
          const btn = document.createElement("a");
          btn.className = "taskbar-app";

          if (app === "questionnaire") {
            btn.href = "Questionaire/index.html";
            btn.textContent = "Questionnaire";
          } else if (app === "observation") {
            btn.href = "Observation-tool/index.html";
            btn.textContent = "Observation Tool";
          }

          container.appendChild(btn);
        });
      }

      // ===== Live Clock =====
      function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, "0");
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        hours = hours ? hours : 12;
        document.getElementById("xp-clock").textContent =
          `${hours}:${minutes} ${ampm}`;
      }

      // Initialize
      updateClock();
      setInterval(updateClock, 1000);
      renderTaskbar();

      document
        .getElementById("recycle-hotspot")
        .addEventListener("click", function () {
          window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");
        });
    </script>
  </body>
</html>
