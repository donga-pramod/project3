    <div id="xp-clock">
      <script>
        const clock = document.getElementById("xp-clock");

        function updateClockPosition() {
          const w = window.innerWidth;
          const h = window.innerHeight;

          const rightPercent = 0.017;
          const bottomPercent = 0.012; 

          clock.style.right = w * rightPercent + "px";
          clock.style.bottom = h * bottomPercent + "px";
        }

        function updateClock() {
          const now = new Date();
          let hours = now.getHours();
          const minutes = now.getMinutes().toString().padStart(2, "0");
          const ampm = hours >= 12 ? "PM" : "AM";

          hours = hours % 12;
          hours = hours ? hours : 12;

          clock.textContent = `${hours}:${minutes} ${ampm}`;
        }

        // Initialize
        updateClock();
        updateClockPosition();

        // Keep updating
        setInterval(updateClock, 1000);
        window.addEventListener("resize", updateClockPosition);
      </script>
    </div>
    <div id="recycle-bin">
      <script>
        const hotspot = document.getElementById("recycle-bin");

        function updateHotspot() {
          const w = window.innerWidth;
          const h = window.innerHeight;

          const leftPercent = 0.91;
          const rightPercent = 0.99;
          const topPercent = 0.81;
          const bottomPercent = 0.9;

          const left = w * leftPercent;
          const width = w * (rightPercent - leftPercent);
          const top = h * topPercent;
          const height = h * (bottomPercent - topPercent);

          hotspot.style.left = left + "px";
          hotspot.style.top = top + "px";
          hotspot.style.width = width + "px";
          hotspot.style.height = height + "px";
        }

        updateHotspot();
        window.addEventListener("resize", updateHotspot);

        document.addEventListener("mousemove", function (e) {
          const rect = hotspot.getBoundingClientRect();
          const isOver =
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom;
        });

        hotspot.addEventListener("click", function () {
          window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");
        });
      </script>
    </div>
