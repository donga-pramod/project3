<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Project#3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Assets/Taskbar/taskbar.css">
</head>
<body>
    <!-- Main Navigation Window -->
    <div class="window">
        <div class="title-bar">
            <span class="title">Portfolio Project#3</span>
        </div>
        <div class="window-content">
            <p class="instruction">Select a tool to continue:</p>
            
            <div class="button-container">
                <a href="Questionaire/index.html" class="xp-button" onclick="openApp('questionnaire')">
                    Online Questionnaire
                </a>
                
                <a href="Observation-tool/index.html" class="xp-button" onclick="openApp('observation')">
                    Observation Tool
                </a>
            </div>
        </div>

        <footer>
            <p>Developed by Aryal Pramod [2573412], Khatiwada Rabin [2573400] and Mandal Rajnish [2573408]</p>
        </footer>
    </div>

    <!-- Recycle Bin Easter Egg -->
    <div id="recycle-hotspot" title="Recycle Bin"></div>

    <!-- Windows XP Taskbar -->
    <div id="taskbar">
        <a href="index.html" class="start-button" title="Start">
            <div class="start-logo"></div>
            <span>Start</span>
        </a>
        <div class="taskbar-apps" id="taskbarApps"></div>
        <div class="system-tray">
            <div id="xp-clock">12:00 AM</div>
        </div>
    </div>

    <script src="Assets/Taskbar/taskbar.js"></script>
    <script>
        // Recycle Bin → Rickroll
        document.getElementById('recycle-hotspot').addEventListener('click', function() {
            window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
        });
    </script>
</body>
</html>
